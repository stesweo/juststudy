name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download music file from the "music" release
        shell: bash
        run: gh release download music --pattern classical-music.ogg --dir app
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: JustStudy-Windows-Installer
          path: dist/*.exe
