name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download music file from the "music" release
        shell: bash
        run: gh release download music --pattern classical-music.ogg --dir app
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write Google Tasks config from repo secrets
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('google-config.json',JSON.stringify({clientId:process.env.GOOGLE_CLIENT_ID,clientSecret:process.env.GOOGLE_CLIENT_SECRET}))"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.exe
          archive: false
